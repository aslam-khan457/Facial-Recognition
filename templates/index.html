<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Emotion Detector</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&display=swap" rel="stylesheet">
    <style>
        * {
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', sans-serif;
            background-color: #f9fafc;
            margin: 0;
            padding: 40px 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            color: #1e1e2f;
        }

        h1 {
            font-size: 2.2rem;
            margin-bottom: 30px;
        }

        form {
            background-color: #ffffff;
            padding: 30px 40px;
            border-radius: 12px;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.05);
            width: 100%;
            max-width: 420px;
            text-align: center;
        }

        input[type="file"] {
            margin-bottom: 20px;
            font-size: 1rem;
        }

        input[type="submit"] {
            background-color: #2563eb;
            color: white;
            border: none;
            padding: 12px 24px;
            border-radius: 8px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: background-color 0.3s ease;
        }

        input[type="submit"]:hover {
            background-color: #1d4ed8;
        }

        .result {
            margin-top: 40px;
            text-align: center;
        }

        .result img {
            border-radius: 10px;
            max-width: 100%;
            height: auto;
            box-shadow: 0 6px 16px rgba(0, 0, 0, 0.1);
        }

        .emotion {
            margin-top: 16px;
            font-size: 1.2rem;
            font-weight: 600;
            color: #2563eb;
        }

        a {
            margin-top: 30px;
            text-decoration: none;
            color: #2563eb;
            font-weight: 500;
            transition: color 0.2s;
        }

        a:hover {
            color: #1d4ed8;
        }
    </style>
</head>
<body>
    <h1>Emotion Detector</h1>
    <form method="POST" action="/upload" enctype="multipart/form-data">
        <input type="file" name="image" accept="image/*" required><br><br>
        <input type="submit" value="Detect Emotion">
    </form>

    {% if result_img %}
        <div class="result">
            <h2>Result</h2>
            <img src="{{ result_img }}" width="400" alt="Processed Image">
            {% if emotion %}
                <div class="emotion">Detected Emotion: {{ emotion }}</div>
            {% endif %}
        </div>
    {% endif %}

    <a href="/webcam">Use Webcam Instead →</a>
</body>
</html>
